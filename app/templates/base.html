<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="30">
  <title>{% block title %}产品状态监控{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <div><a class="brand" href="/">厂内产品状态监控</a><a class="nav-link" href="/daily">每日看板</a><span class="environment">UAT</span></div>
    <div class="topbar-note">自动刷新：30 秒 · 所有页面时间为中国标准时间（UTC+8）</div>
  </header>
  <div id="broker-status" class="broker-status" role="status">MQTT Broker：正在检查服务端接收状态…</div>
  <main>{% block content %}{% endblock %}</main>
  <script>
    async function refreshBrokerStatus() {
      const banner = document.getElementById("broker-status");
      try {
        const response = await fetch("/api/runtime-status", { cache: "no-store" });
        if (!response.ok) throw new Error("status request failed");
        const status = (await response.json()).mqtt_consumer;
        if (status.connected) {
          banner.textContent = "MQTT Broker：已连接，服务端正在接收网关数据";
          banner.className = "broker-status is-connected";
        } else {
          banner.textContent = "MQTT Broker：连接中断，网关状态和广播数据可能不是最新";
          banner.className = "broker-status is-disconnected";
        }
      } catch (error) {
        banner.textContent = "监控服务状态不可用，请稍后刷新页面";
        banner.className = "broker-status is-disconnected";
      }
    }
    refreshBrokerStatus();
    setInterval(refreshBrokerStatus, 5000);
  </script>
</body>
</html>
