# Factory BLE Gateway UAT: durable server Consumer subscription queue.
# Network security remains deliberately simplified for internal UAT only.
listener 1883 192.168.19.21
allow_anonymous true

# Retain the fixed Consumer subscription and QoS 1 messages while its web
# process reconnects. The main mosquitto.conf already enables persistence and
# uses /var/lib/mosquitto/ for its database.
autosave_interval 5
max_queued_messages 100000
max_queued_bytes 67108864
