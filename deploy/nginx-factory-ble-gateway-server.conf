server {
    listen 80;
    server_name ble-gateway-uat.singularmedical.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ble-gateway-uat.singularmedical.net;
    ssl_certificate /etc/nginx/certs/ble-gateway-uat.crt;
    ssl_certificate_key /etc/nginx/certs/ble-gateway-uat.key;

    # Keep the existing OTA release service on the same UAT host.
    location /ota/ {
        alias /srv/ble-gateway-data/ota/;
        autoindex off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
